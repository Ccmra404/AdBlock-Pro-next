name: Build AdBlock Pro ARM64 root module ZIP

on:
  pull_request:
    paths:
      # Any file entering the installer ZIP must trigger an ARM64 package test.
      - "tools/bootstrap/**"
      - "tools/ai/**"
      - "customize.sh"
      - "module.prop"
      - "action.sh"
      - "service.sh"
      - "uninstall.sh"
      - "bindhosts.sh"
      - "webui-config.sh"
      - "webui-job.sh"
      - "settings.conf"
      - "config-blacklist.txt"
      - "config-whitelist.txt"
      - "scripts/**"
      - "rules/**"
      - "certs/**"
      - "webroot/**"
      - "META-INF/**"
      - "bin/AdGuardHome"
      - "bin/data/filters/**"
      - "tests/**"
      - "upstream/**"
      - "tools/*.py"
      - "tools/*.sh"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - ".github/workflows/**"
  # Only an explicit main-branch workflow_dispatch can create a Release.
  workflow_dispatch:
    inputs:
      channel:
        description: Publication type (requires maintainer authorization)
        type: choice
        default: prerelease
        options:
          - prerelease
          - stable

permissions:
  contents: read

concurrency:
  group: release-arm64-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-curl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build pinned curl and OpenSSL for Android ARM64
        run: bash tools/build_android_curl.sh
      - uses: actions/upload-artifact@v4
        with:
          name: adblock-curl-arm64
          path: bin/curl
          if-no-files-found: error
          retention-days: 1
  package:
    needs: build-curl
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.assemble.outputs.version }}
    env:
      ARTIFACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: adblock-curl-arm64
          path: bin
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Test per-device credential generator
        working-directory: tools/bootstrap
        run: |
          go mod download
          git diff --exit-code -- go.mod go.sum
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../bin/adblock-bootstrap .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/adblock-bootstrap-native .
      - name: Validate generated initial configuration with bundled AdGuard Home
        run: |
          uname -m
          # GitHub source blobs need not retain an executable bit.
          chmod 755 ./bin/AdGuardHome
          mkdir -p /tmp/adblock-config-test
          /tmp/adblock-bootstrap-native /tmp/adblock-config-test/AdGuardHome.yaml /tmp/adblock-config-test/admin.auth
          test -s /tmp/adblock-config-test/admin.auth
          test -s /tmp/adblock-config-test/AdGuardHome.yaml
          file ./bin/AdGuardHome
          echo "AdGuard Home emulator version check:"
          ./bin/AdGuardHome --version || true
          echo "Testing bootstrap config:"
          if ! ./bin/AdGuardHome --check-config --config /tmp/adblock-config-test/AdGuardHome.yaml; then
            echo "Config validation failed; emulator diagnostics:"
            ./bin/AdGuardHome --check-config --config /tmp/adblock-config-test/AdGuardHome.yaml > /tmp/agh-diagnostics.log 2>&1 || true
            tail -n 55 /tmp/agh-diagnostics.log
            exit 1
          fi
          rm -rf /tmp/adblock-config-test
      - name: Test and build optional AI analysis helper
        working-directory: tools/ai
        run: |
          go mod download
          git diff --exit-code -- go.mod go.sum
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../bin/adblock-ai .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/adblock-ai-native .
      - name: Scan module-owned Go helpers for known vulnerabilities
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          checker="$(go env GOPATH)/bin/govulncheck"
          for module_dir in tools/bootstrap tools/ai; do
            (cd "$module_dir" && "$checker" ./...)
          done
          # Stripped binaries can fall back to module-only false positives.
          # These ARM64 siblings use the same source/toolchain without -s -w.
          for helper in /tmp/adblock-bootstrap-native /tmp/adblock-ai-native; do
            "$checker" -mode=binary "$helper"
          done
      - name: Verify personal filters on first boot and refresh with native ARM64 core
        run: python3 tools/test_personal_filter.py --engine ./bin/AdGuardHome --bootstrap /tmp/adblock-bootstrap-native
      - name: Run project checks
        run: |
          for script in action.sh bindhosts.sh customize.sh service.sh uninstall.sh webui-config.sh webui-job.sh scripts/*.sh; do
            bash -n "$script"
          done
          node --input-type=module --check < webroot/app.js
          node --input-type=module --check < webroot/kernelsu.js
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Assemble installable root module ZIP
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(sed -n 's/^version=//p' module.prop)"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid module release version: $TAG" >&2; exit 1 ;;
          esac
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          stage="$(mktemp -d)"
          mkdir -p "$stage/bin/data/filters" "$stage/licenses" dist
          cp module.prop action.sh customize.sh service.sh uninstall.sh bindhosts.sh webui-config.sh webui-job.sh settings.conf config-blacklist.txt config-whitelist.txt LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            TAG="${TAG}-dev.${ARTIFACT_SHA:0:7}"
            sed -i "s/^version=.*/version=$TAG/" "$stage/module.prop"
          fi
          cp -a META-INF scripts webroot rules certs "$stage/"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            # Test packages sync the reviewed commit, never an unrelated main snapshot.
            sed -i "s@AdBlock-Pro-next/main/rules/@AdBlock-Pro-next/$ARTIFACT_SHA/rules/@" "$stage/scripts/rule-store.sh"
          fi
          cp licenses/AWAvenue-GPL-3.0.txt licenses/curl-COPYING.txt licenses/openssl-LICENSE.txt licenses/cacert-MPL-2.0.txt licenses/go-openai-Apache-2.0.txt licenses/go-BSD-3-Clause.txt licenses/go-crypto-BSD-3-Clause.txt "$stage/licenses/"
          cp bin/AdGuardHome bin/adblock-bootstrap bin/curl bin/adblock-ai "$stage/bin/"
          cp bin/data/filters/10007.txt bin/data/filters/1791638912.txt "$stage/bin/data/filters/"
          chmod 755 "$stage/bin/AdGuardHome" "$stage/bin/adblock-bootstrap" "$stage/bin/curl" "$stage/bin/adblock-ai"
          (cd "$stage" && zip -q -r -9 "$GITHUB_WORKSPACE/dist/AdBlock-Pro-$TAG-arm64.zip" .)
          rm -rf "$stage"
          unzip -t "dist/AdBlock-Pro-$TAG-arm64.zip" | tail -n 1
          unzip -Z1 "dist/AdBlock-Pro-$TAG-arm64.zip" | grep -qx "bin/adblock-bootstrap"
          unzip -Z1 "dist/AdBlock-Pro-$TAG-arm64.zip" | grep -qx "META-INF/com/google/android/update-binary"
          if unzip -Z1 "dist/AdBlock-Pro-$TAG-arm64.zip" | grep -Eq '(^|/)(admin[.]auth|AdGuardHome[.]yaml)$'; then
            echo "SECURITY ERROR: archived credentials/configuration" >&2
            exit 1
          fi
          python3 tools/validate_module_zip.py "dist/AdBlock-Pro-$TAG-arm64.zip" --version "$TAG" --version-code "$(sed -n 's/^versionCode=//p' module.prop)"
          (cd dist && sha256sum "AdBlock-Pro-$TAG-arm64.zip" > "AdBlock-Pro-$TAG-arm64.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: AdBlock-Pro-test-${{ github.run_id }}-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.package.outputs.version }}
      CHANNEL: ${{ inputs.channel || 'prerelease' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AdBlock-Pro-test-${{ github.run_id }}-arm64
          path: dist
      - name: Verify publication preconditions and artifact checksum
        run: |
          set -euo pipefail
          python3 tools/release_guard.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$GITHUB_SHA"
          (cd dist && sha256sum -c "AdBlock-Pro-$TAG-arm64.zip.sha256")
          python3 tools/validate_module_zip.py "dist/AdBlock-Pro-$TAG-arm64.zip" --version "$TAG" --version-code "$(sed -n 's/^versionCode=//p' module.prop)"
      - name: Create a new immutable release
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            prerelease) prerelease=true; latest=false; build_type='ARM64 test build' ;;
            stable)
              case "$TAG" in *-*) echo 'Stable releases cannot use prerelease tags.' >&2; exit 1 ;; esac
              prerelease=false; latest=true; build_type=ARM64
              ;;
            *) echo 'Invalid publication channel.' >&2; exit 1 ;;
          esac
          notes="docs/release-$TAG.md"
          test -s "$notes" || { echo "Missing release notes: $notes" >&2; exit 1; }
          cp "$notes" /tmp/release-notes.md
          if [ "$CHANNEL" = stable ]; then
            cp "$notes" dist/changelog.md
            python3 tools/module_update.py --module-prop module.prop --tag "$TAG" --output dist/update.json
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "AdBlock Pro $TAG ($build_type)" --notes-file /tmp/release-notes.md --prerelease="$prerelease" --latest="$latest"
