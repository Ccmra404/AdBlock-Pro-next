# AdBlock Pro v3 runtime settings
enable_iptables=true

# Leave IPv6 DNS alone by default. This avoids breaking IPv6-only networks;
# DNS traffic that bypasses IPv4 redirection is reported in diagnostics.
block_ipv6_dns=false
enable_ipv6_dns=false

redir_port=5591
startup_timeout=120

# Boot-only delay (seconds): wait briefly after Android finishes booting.
# Then wait for an IPv4/IPv6 default route, WITHOUT probing external DNS.
# Both waits are bounded; after timeout the local DNS engine starts offline.
# Set 0 to disable an individual wait. Existing installs use these defaults.
boot_start_delay=8
boot_network_wait=20
adg_user=root
adg_group=net_raw
ignore_dest_list=""
ignore_src_list=""
timezone="Asia/Shanghai"

readonly AGH_DIR="/data/adb/adblockpro"
readonly BIN_DIR="$AGH_DIR/bin"
readonly SCRIPT_DIR="$AGH_DIR/scripts"
readonly PID_FILE="$AGH_DIR/bin/agh.pid"
readonly MOD_PATH="/data/adb/modules/bindhosts_personal"
